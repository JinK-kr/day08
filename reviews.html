<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 · AI 답글 · 골목카페</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* ===== 공통 시작 — 다섯 페이지가 똑같이 쓴다 (PRD 6장). 고치면 다섯 파일을 모두 고친다. ===== */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --sidebar: #2B2118;
  --text: #2B2118;
  --muted: #76685A;
  --line: #E8DFD3;
  --accent: #A85A17;
  --accent-soft: #F3E4D3;
  --bar: #B5A38F;
  --good: #2E7D4F;
  --warn: #A66300;
  --bad: #B3261E;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
h1 { margin: 0; font-size: 22px; font-weight: 700; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { padding: 32px; }
.wrap { max-width: 1120px; }
.page-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 20px; }
.page-head p { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card-label { color: var(--muted); font-size: 13px; }
.card-value { font-size: 28px; font-weight: 700; line-height: 1.3; }
.card-sub { color: var(--muted); font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn-quiet { border-color: var(--line); background: var(--surface); color: var(--text); font-weight: 500; }
.btn-small { padding: 6px 12px; font-size: 13px; }
.btn-danger { border-color: var(--bad); background: var(--bad); }

.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
.input { min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 15px; }
.input::placeholder { color: var(--muted); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.form-error { color: var(--bad); font-size: 13px; }
.chip { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.step { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 17px; line-height: 1; }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge::before { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); content: ""; }
.badge-good::before { background: var(--good); }
.badge-warn::before { background: var(--warn); }
.badge-bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad); }
.badge-bad::before { background: var(--bad); }

.notice { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.notice::before { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); color: #fff; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; content: "i"; }
.notice.is-error { border-color: var(--bad); }
.notice.is-error::before { background: var(--bad); content: "!"; }
.notice p { flex: 1 1 260px; }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-weight: 400; text-align: left; }
.table thead th { color: var(--muted); font-size: 13px; }
.table .num { font-variant-numeric: tabular-nums; text-align: right; }
.table tbody tr:last-child > * { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.skeleton span { display: block; height: 20px; border-radius: 6px; background: var(--line); }
.empty { padding: 32px 16px; color: var(--muted); text-align: center; }
.muted { color: var(--muted); }

.toast { position: fixed; bottom: 24px; left: 50%; z-index: 10; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px; background: var(--text); color: #fff; font-size: 14px; transform: translateX(-50%); }
.toast.is-error { background: var(--bad); }

@media (max-width: 760px) { .page { padding: 16px; } }
/* ===== 공통 끝 ===== */

/* 리뷰 추가 */
.add { margin-bottom: 16px; }
.add h2 { margin-bottom: 12px; }
.add-grid { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; align-items: end; gap: 12px; }
.add textarea { height: 40px; resize: vertical; }
.add .form-error { margin-top: 10px; }

/* 요약 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }

/* 리뷰 목록 */
.tools { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ai-note { font-size: 13px; }
.reviews { display: grid; gap: 16px; }
.review-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 8px; }
.stars { color: var(--accent); font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
.stars i { color: var(--bar); font-style: normal; }
.review-text, .reply-text { overflow-wrap: anywhere; white-space: pre-wrap; }
.reply { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: var(--bg); }
.reply-label { margin-bottom: 4px; color: var(--muted); font-size: 13px; font-weight: 600; }
.reply textarea { display: block; width: 100%; min-height: 110px; resize: vertical; }
.review-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.review .form-error { margin-top: 8px; }
.skeleton span + span { width: 60%; margin-top: 10px; }
.list[data-state="loading"][data-loaded] .reviews { opacity: .55; }

@media (max-width: 760px) {
  .add-grid { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body class="page">

<div class="wrap">
  <header class="page-head">
    <h1>리뷰 · AI 답글</h1>
    <p id="summary"></p>
  </header>

  <div class="notice is-error" id="notice" hidden>
    <p>리뷰를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.</p>
    <button type="button" class="btn btn-quiet" id="retry">다시 시도</button>
  </div>

  <form class="card add" id="add" novalidate>
    <h2>리뷰 추가</h2>
    <div class="add-grid">
      <label class="field">별점
        <select class="input" id="add-rating">
          <option value="5">5점</option>
          <option value="4">4점</option>
          <option value="3">3점</option>
          <option value="2">2점</option>
          <option value="1">1점</option>
        </select>
      </label>
      <label class="field">리뷰 내용
        <textarea class="input" id="add-content" maxlength="1000" placeholder="손님이 남긴 리뷰를 붙여 넣으세요"></textarea>
      </label>
      <button class="btn btn-quiet" id="add-submit">추가</button>
    </div>
    <p class="form-error" id="add-error" role="alert" hidden></p>
  </form>

  <div class="stats">
    <div class="card">
      <p class="card-label">평균 별점</p>
      <p class="card-value" id="v-rating">–</p>
      <p class="card-sub" id="s-rating">&nbsp;</p>
    </div>
    <div class="card">
      <p class="card-label">답글 기다리는 리뷰</p>
      <p class="card-value" id="v-waiting">–</p>
      <p class="card-sub" id="s-waiting">&nbsp;</p>
    </div>
    <div class="card">
      <p class="card-label">아쉬움으로 분석된 리뷰</p>
      <p class="card-value" id="v-sad">–</p>
      <p class="card-sub" id="s-sad">&nbsp;</p>
    </div>
  </div>

  <section class="list" id="list" data-state="loading">
    <div class="tools" id="tools" hidden>
      <div class="chips" id="chips" role="group" aria-label="리뷰 걸러 보기"></div>
      <p class="muted ai-note" id="ai-note"></p>
    </div>
    <div class="reviews" id="reviews"></div>
    <p class="card empty" id="empty" hidden></p>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase 연결 — publishable key만 넣는다. */
const SUPABASE_URL = 'https://ngyqprsdcajizpzoqxip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NwDpUc3O_dfJvOt9tA_Dhw_McmOYcMV';
const AI_URL = `${SUPABASE_URL}/functions/v1/cafe-ai`;
const AI_MODEL_KEY = 'cafe-ai-model'; // 대시보드 왼쪽 아래 "AI 모델"에서 고른 값
const COLUMNS = 'id, rating, content, sentiment, reply, created_at';
const MAX_TEXT = 1000;
const FILTERS = ['전체', '답글 기다리는 중', '좋음', '보통', '아쉬움'];
const BADGE = { 좋음: 'badge badge-good', 보통: 'badge', 아쉬움: 'badge badge-bad' };

const $ = id => document.getElementById(id);
const count = n => n.toLocaleString('ko-KR');
const day = iso => new Date(iso).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric' });

let db;
let reviews = [];
let filter = '전체', lowFirst = false;
let busyId = null;    // AI가 분석하는 중인 리뷰 (한 번에 하나만)
let editingId = null; // 답글을 고치는 중인 리뷰
let confirmId = null; // 지금 답글을 새 초안으로 바꿀지 묻는 중인 리뷰
const problems = new Map(); // 리뷰마다 마지막으로 실패한 이유
const drafts = new Map();   // 리뷰마다 쓰다가 아직 저장하지 않은 답글. 다른 리뷰를 고치러 가도 남는다
let modelNames = {};

// 글자는 모두 textContent로 넣는다 (리뷰는 손님이 쓴 글)
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'text') node.textContent = value;
    else if (value === true) node.setAttribute(key, '');
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  node.append(...children.filter(Boolean));
  return node;
}

/* ───── 불러오기 ───── */
async function load() {
  setState('loading');
  try {
    if (!window.supabase) throw new Error('Supabase 연결 도구를 불러오지 못했다');
    db ??= supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    reviews = await fetchAll(() => db.from('reviews').select(COLUMNS));
    editingId = confirmId = null;
    $('list').dataset.loaded = 'true';
    setState('ready');
    render();
  } catch (err) {
    console.error(err);
    setState('error');
  }
}

// Supabase는 한 번에 1,000줄까지만 준다.
async function fetchAll(query) {
  const size = 1000, rows = [];
  for (let from = 0; ; from += size) {
    const { data, error } = await query().order('id').range(from, from + size - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < size) return rows;
  }
}

function setState(state) {
  const list = $('list');
  list.dataset.state = state;
  $('notice').hidden = state !== 'error';
  if (list.dataset.loaded) return; // 다시 불러올 때는 보던 목록을 그대로 둔다
  $('empty').hidden = true;
  $('reviews').replaceChildren(...(state === 'loading'
    ? Array.from({ length: 3 }, () => el('div', { class: 'card skeleton' }, el('span'), el('span')))
    : []));
}

/* ───── AI 부르기 ───── */
async function askCafeAi(body) {
  let res;
  try {
    res = await fetch(AI_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {
    throw new Error('AI에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
  }
  const data = await res.json().catch(() => null);
  if (!res.ok || !data) throw new Error(data?.error ?? 'AI가 답하지 못했어요. 잠시 뒤에 다시 해 주세요.');
  return data;
}

function chosenModel() {
  try { return localStorage.getItem(AI_MODEL_KEY); } catch { return null; }
}

// 지금 어느 모델로 분석하는지 보여 준다. 대시보드에서 모델을 바꾸면 바로 따라 바뀐다.
async function showModel() {
  try {
    if (!Object.keys(modelNames).length) {
      const { models, default: fallback } = await askCafeAi({ type: 'models' });
      modelNames = Object.fromEntries(models.map(m => [m.id, m.name]));
      modelNames[''] = modelNames[fallback];
    }
    const name = modelNames[chosenModel()] ?? modelNames[''];
    $('ai-note').textContent = `AI 모델: ${name} · 대시보드 왼쪽 아래에서 바꿀 수 있어요`;
  } catch {
    $('ai-note').textContent = '';
  }
}
addEventListener('storage', e => { if (e.key === AI_MODEL_KEY) showModel(); });

/* ───── 그리기 ───── */
const isWaiting = r => !r.reply;

function render() {
  const rated = reviews.reduce((sum, r) => sum + r.rating, 0);
  const waiting = reviews.filter(isWaiting).length;
  const bySentiment = name => reviews.filter(r => r.sentiment === name).length;
  const analyzed = reviews.filter(r => r.sentiment).length;
  $('summary').textContent = reviews.length ? `리뷰 ${count(reviews.length)}개` : '';
  $('v-rating').textContent = reviews.length ? (rated / reviews.length).toFixed(1) + '점' : '–';
  $('s-rating').textContent = reviews.length ? `리뷰 ${count(reviews.length)}개의 평균` : '아직 리뷰가 없어요';
  $('v-waiting').textContent = count(waiting) + '개';
  $('s-waiting').textContent = waiting ? '"AI 분석"을 누르면 답글 초안이 저장돼요' : '모든 리뷰에 답글이 있어요';
  $('v-sad').textContent = count(bySentiment('아쉬움')) + '개';
  $('s-sad').textContent = analyzed ? `좋음 ${count(bySentiment('좋음'))} · 보통 ${count(bySentiment('보통'))} · 분석 전 ${count(reviews.length - analyzed)}` : '아직 분석한 리뷰가 없어요';

  $('tools').hidden = !reviews.length;
  $('chips').replaceChildren(
    ...FILTERS.map(name => el('button', { type: 'button', class: 'chip', 'data-filter': name, 'aria-pressed': String(name === filter), text: name })),
    el('button', { type: 'button', class: 'chip', 'data-sort': 'low', 'aria-pressed': String(lowFirst), text: '별점 낮은 순' }));

  const shown = reviews
    .filter(r => filter === '전체' || (filter === '답글 기다리는 중' ? isWaiting(r) : r.sentiment === filter))
    .sort((a, b) => (lowFirst ? a.rating - b.rating : 0) || Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
  // 답글을 쓰는 도중에 다른 리뷰의 분석이 끝나 다시 그려도, 커서는 그대로 둔다 (쓰던 글은 drafts에 있어 card가 다시 채운다)
  const old = $('reviews').querySelector('[data-reply]');
  const cursor = old && document.activeElement === old && { id: old.dataset.reply, at: [old.selectionStart, old.selectionEnd] };
  $('reviews').replaceChildren(...shown.map(card));
  const box = cursor && $('reviews').querySelector(`[data-reply="${cursor.id}"]`);
  if (box) { box.focus(); box.setSelectionRange(...cursor.at); }
  $('empty').hidden = shown.length > 0;
  $('empty').textContent = reviews.length ? '조건에 맞는 리뷰가 없어요.' : '아직 리뷰가 없어요. 위에서 리뷰를 추가해 보세요.';
}

function card(r) {
  const stars = el('span', { class: 'stars', role: 'img', 'aria-label': `별점 ${r.rating}점` }, '★'.repeat(r.rating), el('i', { text: '☆'.repeat(5 - r.rating) }));
  const sentiment = r.sentiment
    ? el('span', { class: BADGE[r.sentiment] ?? 'badge', text: r.sentiment })
    : el('span', { class: 'muted', text: '분석 전' });
  const head = el('div', { class: 'review-head' }, stars, el('strong', { text: `${r.rating}점` }), el('span', { class: 'muted', text: day(r.created_at) }), sentiment);

  const editing = r.id === editingId;
  const reply = el('div', { class: 'reply' },
    el('p', { class: 'reply-label', text: '사장님 답글' }),
    editing
      ? el('textarea', { class: 'input', 'data-reply': r.id, maxlength: MAX_TEXT, 'aria-label': '사장님 답글', text: drafts.get(r.id) ?? r.reply ?? '' })
      : el('p', { class: r.reply ? 'reply-text' : 'reply-text muted', text: r.reply || '아직 답글이 없어요. "AI 분석"을 누르면 감정과 답글 초안을 만들어 저장해요.' }));

  const button = (act, text, look = 'btn-quiet', more = {}) =>
    el('button', { type: 'button', class: `btn ${look} btn-small`, 'data-act': act, 'data-id': r.id, text, ...more });
  const aiOff = busyId !== null; // 분석은 한 번에 하나만 한다
  let actions;
  if (editing) {
    actions = [button('save', '저장', ''), button('cancel', '취소')];
  } else if (r.id === busyId) {
    actions = [button('analyze', '분석하는 중…', '', { disabled: true })];
  } else if (r.id === confirmId) {
    actions = [el('span', { class: 'muted', text: '지금 답글을 새 초안으로 바꿀까요?' }), button('analyze', '바꾸기', ''), button('keep', '취소')];
  } else {
    actions = [
      r.reply ? button('ask', '다시 분석', 'btn-quiet', { disabled: aiOff }) : button('analyze', 'AI 분석', '', { disabled: aiOff }),
      button('edit', drafts.has(r.id) ? '쓰던 답글 이어 쓰기' : r.reply ? '답글 고치기' : '직접 쓰기'),
      r.reply && button('copy', '답글 복사'),
    ];
  }
  const problem = problems.get(r.id);
  return el('article', { class: 'card review', 'data-id': r.id },
    head,
    el('p', { class: 'review-text', text: r.content }),
    reply,
    el('div', { class: 'review-actions' }, ...actions),
    problem && el('p', { class: 'form-error', role: 'alert', text: problem }));
}

const byId = id => reviews.find(r => r.id === id);
// 다시 그리면 누른 버튼이 사라져 초점을 잃는다. 그 리뷰의 버튼으로 되돌리되, 그사이 다른 곳을 쓰고 있으면 건드리지 않는다
function focusAct(act, id) {
  if (document.activeElement !== document.body) return;
  $('reviews').querySelector(`[data-act="${act}"][data-id="${id}"]:not(:disabled)`)?.focus();
}

/* ───── AI 분석: 감정과 답글 초안을 받아 바로 저장한다 ───── */
async function analyze(id) {
  const r = byId(id);
  busyId = id;
  confirmId = null;
  problems.delete(id);
  render();
  try {
    const body = { type: 'review', rating: r.rating, content: r.content };
    const model = chosenModel();
    if (model) body.model = model;
    const ai = await askCafeAi(body);
    const { data, error } = await db.from('reviews').update({ sentiment: ai.sentiment, reply: ai.reply }).eq('id', id).select(COLUMNS).single();
    if (error) {
      console.error(error);
      throw new Error('분석은 됐는데 저장하지 못했어요. 다시 눌러 주세요.');
    }
    Object.assign(r, data);
    toast(`분석해서 저장했어요. 감정: ${data.sentiment}`);
  } catch (err) {
    problems.set(id, err.message);
  } finally {
    busyId = null;
    render();
    focusAct('ask', id);     // 저장됐으면 "다시 분석"
    focusAct('analyze', id); // 실패했으면 "AI 분석"
  }
}

/* ───── 답글 고치기 · 복사 ───── */
async function saveReply(id) {
  const box = $('reviews').querySelector(`[data-reply="${id}"]`);
  const text = box.value.trim();
  const buttons = box.closest('.review').querySelectorAll('button');
  buttons.forEach(b => { b.disabled = true; });
  const { data, error } = await db.from('reviews').update({ reply: text || null }).eq('id', id).select(COLUMNS).single();
  if (error) {
    console.error(error);
    problems.set(id, '답글을 저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
    render(); // 쓰던 글은 drafts에 있어 그대로 나온다
    return;
  }
  Object.assign(byId(id), data);
  problems.delete(id);
  drafts.delete(id);
  editingId = null;
  render();
  focusAct('edit', id);
  toast(text ? '답글을 저장했어요.' : '답글을 비웠어요.');
}

async function copyReply(id) {
  const text = byId(id).reply;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // 권한이 없는 브라우저에서는 옛 방식으로 복사한다
    const box = el('textarea', { text });
    document.body.append(box);
    box.select();
    const done = document.execCommand('copy');
    box.remove();
    if (!done) return toast('복사하지 못했어요. 답글 글자를 직접 선택해서 복사해 주세요.', true);
  }
  toast('답글을 복사했어요.');
}

$('reviews').addEventListener('click', e => {
  const button = e.target.closest('[data-act]');
  if (!button) return;
  const id = Number(button.dataset.id);
  const act = button.dataset.act;
  if (act === 'analyze') return analyze(id);
  if (act === 'save') return saveReply(id);
  if (act === 'copy') return copyReply(id);
  if (act === 'cancel') drafts.delete(id); // 취소는 쓰던 글을 버린다
  editingId = act === 'edit' ? id : act === 'cancel' ? null : editingId;
  confirmId = act === 'ask' ? id : null;
  if (act !== 'ask') problems.delete(id);
  render();
  if (act === 'edit') $('reviews').querySelector(`[data-reply="${id}"]`).focus();
  else focusAct({ ask: 'analyze', keep: 'ask', cancel: 'edit' }[act], id);
});

$('reviews').addEventListener('keydown', e => {
  if (e.key === 'Escape' && e.target.matches('[data-reply]')) {
    const id = Number(e.target.dataset.reply);
    drafts.delete(id);
    editingId = null;
    render();
    focusAct('edit', id);
  }
});

// 쓰는 대로 기억해 둔다. 다른 리뷰의 "답글 고치기"를 누르거나 걸러 보기를 바꿔도 쓰던 글이 사라지지 않는다
$('reviews').addEventListener('input', e => {
  if (e.target.matches('[data-reply]')) drafts.set(Number(e.target.dataset.reply), e.target.value);
});

/* ───── 걸러 보기 ───── */
$('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  if (chip.dataset.sort) lowFirst = !lowFirst;
  else filter = chip.dataset.filter;
  confirmId = null; // 고치는 중인 답글은 그대로 둔다
  render();
  $('chips').querySelector(chip.dataset.sort ? '[data-sort]' : `[data-filter="${filter}"]`)?.focus();
});

/* ───── 리뷰 추가 ───── */
$('add').addEventListener('submit', async e => {
  e.preventDefault();
  const content = $('add-content').value.trim();
  const problem = !content ? '리뷰 내용을 적어 주세요.' : content.length > MAX_TEXT ? '리뷰 내용은 1,000자까지 적을 수 있어요.' : null;
  $('add-content').setAttribute('aria-invalid', String(!!problem));
  $('add-error').textContent = problem ?? '';
  $('add-error').hidden = !problem;
  if (problem) return $('add-content').focus();

  const button = $('add-submit');
  button.disabled = true;
  button.textContent = '추가하는 중…';
  const { data, error } = db
    ? await db.from('reviews').insert({ rating: Number($('add-rating').value), content }).select(COLUMNS).single()
    : { error: new Error('연결 전') };
  button.disabled = false;
  button.textContent = '추가';
  if (error) {
    console.error(error);
    $('add-error').textContent = '리뷰를 추가하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';
    $('add-error').hidden = false;
    return;
  }
  filter = '전체'; lowFirst = false; // 방금 넣은 리뷰가 맨 위에 보이게 걸러 보기를 푼다
  if ($('list').dataset.loaded) {
    reviews.push(data);
    render();
  } else {
    await load();
  }
  e.target.reset();
  $('reviews').querySelector(`[data-id="${data.id}"]`)?.scrollIntoView({ block: 'nearest' });
  toast('리뷰를 추가했어요.');
});

/* ───── 알림 ───── */
let toastTimer;
function toast(text, isError = false) {
  const box = $('toast');
  box.textContent = text;
  box.classList.toggle('is-error', isError);
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, isError ? 5000 : 2500);
}

$('retry').addEventListener('click', () => { window.supabase ? load() : location.reload(); });

load();
showModel();
</script>
</body>
</html>
