<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주변 카페 · 골목카페</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* ===== 공통 시작 — 다섯 페이지가 똑같이 쓴다 (PRD 6장). 고치면 다섯 파일을 모두 고친다. ===== */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --sidebar: #2B2118;
  --text: #2B2118;
  --muted: #76685A;
  --line: #E8DFD3;
  --accent: #A85A17;
  --accent-soft: #F3E4D3;
  --bar: #B5A38F;
  --good: #2E7D4F;
  --warn: #A66300;
  --bad: #B3261E;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
h1 { margin: 0; font-size: 22px; font-weight: 700; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { padding: 32px; }
.wrap { max-width: 1120px; }
.page-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 20px; }
.page-head p { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card-label { color: var(--muted); font-size: 13px; }
.card-value { font-size: 28px; font-weight: 700; line-height: 1.3; }
.card-sub { color: var(--muted); font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn-quiet { border-color: var(--line); background: var(--surface); color: var(--text); font-weight: 500; }
.btn-small { padding: 6px 12px; font-size: 13px; }
.btn-danger { border-color: var(--bad); background: var(--bad); }

.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
.input { min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 15px; }
.input::placeholder { color: var(--muted); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.form-error { color: var(--bad); font-size: 13px; }
.chip { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.step { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 17px; line-height: 1; }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge::before { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); content: ""; }
.badge-good::before { background: var(--good); }
.badge-warn::before { background: var(--warn); }
.badge-bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad); }
.badge-bad::before { background: var(--bad); }

.notice { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.notice::before { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); color: #fff; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; content: "i"; }
.notice.is-error { border-color: var(--bad); }
.notice.is-error::before { background: var(--bad); content: "!"; }
.notice p { flex: 1 1 260px; }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-weight: 400; text-align: left; }
.table thead th { color: var(--muted); font-size: 13px; }
.table .num { font-variant-numeric: tabular-nums; text-align: right; }
.table tbody tr:last-child > * { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.skeleton span { display: block; height: 20px; border-radius: 6px; background: var(--line); }
.empty { padding: 32px 16px; color: var(--muted); text-align: center; }
.muted { color: var(--muted); }

.toast { position: fixed; bottom: 24px; left: 50%; z-index: 10; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px; background: var(--text); color: #fff; font-size: 14px; transform: translateX(-50%); }
.toast.is-error { background: var(--bad); }

@media (max-width: 760px) { .page { padding: 16px; } }
/* ===== 공통 끝 ===== */

/* 지도 보기 (지역이나 역 이름 넣기) */
.find { margin-bottom: 16px; }
.find h2 { margin-bottom: 12px; }
.find-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px 16px; }
.find .form-error { margin-top: 10px; }

/* 지도 · 저장해 둔 카페: 카드 제목 줄 */
.list-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; min-height: 33px; margin-bottom: 12px; }
.list-head p { font-size: 13px; }
.list-head .btn { margin-left: auto; }

/* 지도 */
.map { margin-bottom: 16px; }
.map-box { position: relative; height: 360px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
.map-box iframe { display: block; width: 100%; height: 100%; border: 0; }
.map-wait { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.map .notice { margin-bottom: 0; }

/* 저장해 둔 카페 */
.table { min-width: 720px; } /* 좁은 화면에서는 표만 옆으로 넘겨 본다 */
.table th[scope="row"] { font-weight: 600; }
.col-actions { width: 320px; }
.is-shown > * { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); } /* 지금 지도에 띄운 카페 */

@media (max-width: 760px) {
  .find-grid { grid-template-columns: minmax(0, 1fr); }
  .map-box { height: 280px; }
}
</style>
</head>
<body class="page">

<div class="wrap">
  <header class="page-head">
    <h1>주변 카페</h1>
    <p>지역이나 역 이름을 넣으면 그 동네 지도를 보여 드려요</p>
  </header>

  <div class="notice is-error" id="notice" hidden>
    <p>저장해 둔 카페를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.</p>
    <button type="button" class="btn btn-quiet" id="retry">다시 시도</button>
  </div>

  <form class="card find" id="find" novalidate>
    <h2>지도 보기</h2>
    <div class="find-grid">
      <label class="field">지역이나 역 이름
        <input class="input" id="place" maxlength="40" autocomplete="off" placeholder="예: 정발산역, 성수동">
      </label>
      <button class="btn" id="submit">지도 보기</button>
    </div>
    <p class="form-error" id="error" role="alert" hidden></p>
  </form>

  <section class="card map" id="map-card">
    <div class="list-head">
      <h2 id="map-title">지도</h2>
      <p class="muted" id="map-note"></p>
      <a class="btn btn-quiet btn-small" id="map-search" target="_blank" rel="noopener" hidden>카카오맵에서 카페 찾기</a>
    </div>
    <div class="map-box" id="map-box" hidden>
      <iframe id="map" title="지도" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <p class="map-wait" id="map-wait" hidden>지도를 불러오는 중…</p>
    </div>
    <div class="notice is-error" id="map-fail" hidden>
      <p>지도를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.</p>
      <button type="button" class="btn btn-quiet" id="map-retry">다시 시도</button>
    </div>
    <p class="empty" id="map-empty">지역이나 역 이름을 넣거나, 아래 카페의 "지도 보기"를 누르면 여기에 지도가 떠요.</p>
  </section>

  <section class="card list" id="list">
    <div class="list-head">
      <h2>저장해 둔 카페</h2>
      <p class="muted" id="list-note"></p>
    </div>
    <div class="table-wrap" id="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">이름</th>
            <th scope="col">주소</th>
            <th scope="col" class="col-actions" aria-label="지도와 카카오맵"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden></p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase 연결 — publishable key만 넣는다. */
const SUPABASE_URL = 'https://ngyqprsdcajizpzoqxip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NwDpUc3O_dfJvOt9tA_Dhw_McmOYcMV';

/* 이 화면은 키가 필요 없는 주소만 쓴다 (PRD 5.6) */
const GOOGLE_MAP = 'https://www.google.com/maps';                    // 구글 지도를 화면에 끼워 넣는 주소
const KAKAO_SEARCH = 'https://map.kakao.com/link/search/';           // 카카오맵 검색 결과로 가는 링크
const KAKAO_ROUTE = 'https://map.kakao.com/link/to/';                // 카카오맵 길찾기(도착지 = 장소 번호)로 가는 링크
const KAKAO_PLACE = /^https?:\/\/place\.map\.kakao\.com\/(\d+)$/;    // 저장해 둔 카카오맵 링크의 모양. 괄호 안이 장소 번호
const MAP_WAIT = 12000;                                              // 이만큼 기다려도 지도가 안 뜨면 실패로 본다

const $ = id => document.getElementById(id);
const count = n => n.toLocaleString('ko-KR');

let db;
let saved = [];            // rivals 테이블에 저장해 둔 카페
let loadState = 'loading'; // 저장해 둔 카페를 불러오는 중인지: loading · ready · error
let shown = null;          // 지금 지도에 띄운 것 { title, query, zoom, place?, cafeId? }
let mapState = 'idle';     // 지도: idle(아직 없음) · loading · ready · error
let mapTimer;

// 글자는 모두 textContent로 넣는다 (카페 이름과 주소는 바깥에서 온 글)
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'text') node.textContent = value;
    else if (value === true) node.setAttribute(key, '');
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  node.append(...children.filter(Boolean));
  return node;
}

/* ───── 저장해 둔 카페 불러오기 ───── */
async function load() {
  loadState = 'loading';
  render();
  try {
    if (!window.supabase) throw new Error('Supabase 연결 도구를 불러오지 못했다');
    db ??= supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    saved = await fetchAll(() => db.from('rivals').select('id, name, address, kakao_map_url'));
    loadState = 'ready';
  } catch (err) {
    console.error(err);
    loadState = 'error';
  }
  render();
}

// Supabase는 한 번에 1,000줄까지만 준다.
async function fetchAll(query) {
  const size = 1000, rows = [];
  for (let from = 0; ; from += size) {
    const { data, error } = await query().order('id').range(from, from + size - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < size) return rows;
  }
}

/* ───── 지도 띄우기 (구글 지도를 iframe에 끼워 넣는다) ───── */
function openMap(next) {
  shown = next;
  clearTimeout(mapTimer);
  if (!navigator.onLine) { // 끊긴 채로 열면 iframe 안에 브라우저의 영어 오류 화면이 뜬다
    mapState = 'error';
    return render();
  }
  mapState = 'loading';
  render();
  $('map').src = `${GOOGLE_MAP}?output=embed&hl=ko&z=${next.zoom}&q=${encodeURIComponent(next.query)}`;
  mapTimer = setTimeout(() => {
    if (mapState !== 'loading') return;
    mapState = 'error';
    renderMap();
  }, MAP_WAIT);
}

$('map').addEventListener('load', () => {
  if (mapState !== 'loading') return; // 처음 빈 iframe이 생길 때도 load가 한 번 온다
  clearTimeout(mapTimer);
  mapState = 'ready';
  renderMap(); // 표는 다시 그리지 않는다. 다시 그리면 방금 누른 버튼이 초점을 잃는다
});

/* ───── 그리기 ───── */
function render() {
  renderMap();
  renderList();
}

function renderMap() {
  $('map-title').textContent = shown ? shown.title : '지도';
  $('map-note').textContent = mapState === 'ready' ? '구글 지도' : '';
  $('map-empty').hidden = !!shown;
  $('map-box').hidden = mapState === 'idle' || mapState === 'error';
  $('map-wait').hidden = mapState !== 'loading';
  $('map-fail').hidden = mapState !== 'error';
  $('map').title = shown ? shown.title : '지도';
  const search = $('map-search'); // 지역으로 지도를 열었을 때만: 그 동네 카페 목록은 카카오맵에서 본다
  search.hidden = !shown?.place;
  if (shown?.place) search.href = KAKAO_SEARCH + encodeURIComponent(`${shown.place} 카페`);
}

function renderList() {
  $('notice').hidden = loadState !== 'error';
  const loading = loadState === 'loading';
  $('list-note').textContent = loading || !saved.length ? '' : `${count(saved.length)}곳`;
  $('rows').replaceChildren(...(loading
    ? Array.from({ length: 3 }, () => el('tr', { class: 'skeleton' }, el('td', { colspan: 3 }, el('span'))))
    : saved.map(row)));
  $('table-wrap').hidden = !loading && !saved.length;
  $('empty').hidden = loading || saved.length > 0;
  $('empty').textContent = loadState === 'error' ? '저장해 둔 카페를 불러오면 여기에 나와요.' : '저장해 둔 카페가 없어요.';
}

function row(cafe) {
  const placeId = cafe.kakao_map_url?.match(KAKAO_PLACE)?.[1]; // 카카오맵 장소 번호. 없으면 카카오맵 버튼을 만들지 않는다
  const isShown = shown?.cafeId === cafe.id;
  const small = (attrs, text) => el(attrs.href ? 'a' : 'button', { class: 'btn btn-quiet btn-small', ...attrs, text });
  return el('tr', { class: isShown ? 'is-shown' : null },
    el('th', { scope: 'row', text: cafe.name }),
    el('td', { class: cafe.address ? null : 'muted', text: cafe.address || '주소 정보 없음' }),
    el('td', {}, el('span', { class: 'row-actions' },
      cafe.address && small({ type: 'button', 'data-map': cafe.id, 'aria-pressed': String(isShown), 'aria-label': `${cafe.name} 지도 보기` }, '지도 보기'),
      placeId && small({ href: cafe.kakao_map_url, target: '_blank', rel: 'noopener', 'aria-label': `${cafe.name} 카카오맵에서 보기` }, '카카오맵에서 보기'),
      placeId && small({ href: KAKAO_ROUTE + placeId, target: '_blank', rel: 'noopener', 'aria-label': `${cafe.name}까지 카카오맵 길찾기` }, '길찾기'),
      !cafe.address && !placeId && el('span', { class: 'muted', text: '지도 정보 없음' }))));
}

function showProblem(text, focus = false) {
  $('place').setAttribute('aria-invalid', String(focus));
  $('error').textContent = text ?? '';
  $('error').hidden = !text;
  if (focus) $('place').focus();
}

/* ───── 지역이나 역 이름으로 지도 보기 ───── */
$('place').addEventListener('input', () => showProblem(null));

$('find').addEventListener('submit', e => {
  e.preventDefault();
  const place = $('place').value.trim().replace(/\s+/g, ' ');
  if (!place) return showProblem('지역이나 역 이름을 적어 주세요.', true);
  showProblem(null);
  openMap({ title: `${place} 주변 지도`, query: place, zoom: 16, place });
});

/* ───── 저장해 둔 카페를 지도에 띄우기 ───── */
$('rows').addEventListener('click', e => {
  const button = e.target.closest('[data-map]');
  if (!button) return;
  const cafe = saved.find(c => c.id === Number(button.dataset.map));
  openMap({ title: `${cafe.name} 위치`, query: cafe.address, zoom: 17, cafeId: cafe.id });
  $('map-card').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  $('rows').querySelector(`[data-map="${cafe.id}"]`)?.focus({ preventScroll: true }); // 다시 그리면 누른 버튼이 새로 만들어진다
});

$('map-retry').addEventListener('click', () => openMap(shown));
$('retry').addEventListener('click', () => { window.supabase ? load() : location.reload(); });

load();
</script>
</body>
</html>
