<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 · 골목카페</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* ===== 공통 시작 — 다섯 페이지가 똑같이 쓴다 (PRD 6장). 고치면 다섯 파일을 모두 고친다. ===== */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --sidebar: #2B2118;
  --text: #2B2118;
  --muted: #76685A;
  --line: #E8DFD3;
  --accent: #A85A17;
  --accent-soft: #F3E4D3;
  --bar: #B5A38F;
  --good: #2E7D4F;
  --warn: #A66300;
  --bad: #B3261E;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
h1 { margin: 0; font-size: 22px; font-weight: 700; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { padding: 32px; }
.wrap { max-width: 1120px; }
.page-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 20px; }
.page-head p { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card-label { color: var(--muted); font-size: 13px; }
.card-value { font-size: 28px; font-weight: 700; line-height: 1.3; }
.card-sub { color: var(--muted); font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn-quiet { border-color: var(--line); background: var(--surface); color: var(--text); font-weight: 500; }
.btn-small { padding: 6px 12px; font-size: 13px; }
.btn-danger { border-color: var(--bad); background: var(--bad); }

.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
.input { min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 15px; }
.input::placeholder { color: var(--muted); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.form-error { color: var(--bad); font-size: 13px; }
.chip { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.step { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 17px; line-height: 1; }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge::before { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); content: ""; }
.badge-good::before { background: var(--good); }
.badge-warn::before { background: var(--warn); }
.badge-bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad); }
.badge-bad::before { background: var(--bad); }

.notice { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.notice::before { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); color: #fff; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; content: "i"; }
.notice.is-error { border-color: var(--bad); }
.notice.is-error::before { background: var(--bad); content: "!"; }
.notice p { flex: 1 1 260px; }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-weight: 400; text-align: left; }
.table thead th { color: var(--muted); font-size: 13px; }
.table .num { font-variant-numeric: tabular-nums; text-align: right; }
.table tbody tr:last-child > * { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.skeleton span { display: block; height: 20px; border-radius: 6px; background: var(--line); }
.empty { padding: 32px 16px; color: var(--muted); text-align: center; }
.muted { color: var(--muted); }

.toast { position: fixed; bottom: 24px; left: 50%; z-index: 10; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px; background: var(--text); color: #fff; font-size: 14px; transform: translateX(-50%); }
.toast.is-error { background: var(--bad); }

@media (max-width: 760px) { .page { padding: 16px; } }
/* ===== 공통 끝 ===== */

/* 틀: 왼쪽 메뉴 + 가운데 화면 */
body { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100dvh; }
.sidebar { display: flex; flex-direction: column; gap: 24px; padding: 24px 12px; background: var(--sidebar); }
.brand { padding: 0 12px; color: #fff; font-size: 20px; font-weight: 700; line-height: 1.3; }
.brand small { display: block; color: #D9CCBD; font-size: 13px; font-weight: 400; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { padding: 10px 12px; border-radius: 8px; color: #D9CCBD; text-decoration: none; white-space: nowrap; }
.nav a:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.nav a[aria-current="page"] { background: var(--accent); color: #fff; font-weight: 600; }
.nav a:focus-visible { outline-color: #fff; }

/* 오늘 요약 보내기 · AI 모델 고르기 (왼쪽 메뉴 맨 아래) */
.sidebar { overflow-y: auto; }
.share-box, .ai-box { display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 0; border-top: 1px solid rgba(255, 255, 255, .14); color: #D9CCBD; font-size: 13px; }
.share-box { margin-top: auto; }
.share-box button, .ai-box select, .ai-box button { width: 100%; min-height: 36px; padding: 6px 8px; border: 1px solid rgba(255, 255, 255, .28); border-radius: 8px; background: #3A2E23; color: #fff; font-size: 13px; }
.share-box button, .ai-box button { background: transparent; }
.share-box button:hover, .ai-box button:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
.share-box :focus-visible, .ai-box :focus-visible { outline-color: #fff; }
.share-box button { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; } /* 글자 없이 아이콘만 있는 버튼 */
.ai-box p { min-height: 2.8em; line-height: 1.4; overflow-wrap: anywhere; }
.ai-box p[data-tone="good"] { color: #A8DDB9; }
.ai-box p[data-tone="bad"] { color: #F5B5AF; }
main { min-width: 0; min-height: 0; }
.view { height: 100%; overflow: auto; }
iframe.view { display: block; width: 100%; border: 0; }

/* 오늘 요약 보내기: 버튼을 누르면 뜨는 창 */
.share { width: min(440px, calc(100% - 32px)); padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); }
.share::backdrop { background: rgba(43, 33, 24, .45); }
.share h2 { margin-bottom: 4px; }
.share textarea { display: block; width: 100%; margin-top: 12px; line-height: 1.6; resize: none; }
.share .form-error { margin-top: 10px; }
.share-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.share-actions span { margin-right: auto; font-size: 13px; }

/* 아직 없는 페이지 · 불러오지 못한 페이지 */
.soon { display: grid; place-items: center; padding: 32px; text-align: center; }
.soon-badge { display: inline-block; margin-bottom: 12px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); font-size: 13px; font-weight: 600; }
.soon p { margin: 8px 0 24px; color: var(--muted); }

/* 홈 */
.home { container-type: inline-size; }

/* 오늘 브리핑 */
.brief-btn { margin-left: auto; }
.brief { margin-bottom: 16px; }
.brief h2 { margin-bottom: 12px; }
.brief-lines { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.brief-lines li { display: flex; gap: 10px; }
.brief-lines li::before { flex: none; width: 6px; height: 6px; margin-top: .6em; border-radius: 50%; background: var(--accent); content: ""; }
.brief-lines .skeleton span { flex: 1; }
.brief[data-busy] .brief-lines { opacity: .55; }
.brief .form-error { margin-top: 8px; }
.brief-note { margin-top: 10px; font-size: 13px; }

.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
@container (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 440px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.cards > .card-wide { grid-column: 1 / -1; } /* 주변 카페 카드는 숫자 카드 4장 아래에서 한 줄을 다 쓴다 */
a.card { display: flex; flex-direction: column; gap: 2px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--bar); }
a.card .card-label { display: flex; justify-content: space-between; }
a.card .card-label::after { content: "›"; font-size: 15px; line-height: 1.2; }
.card-sub[data-tone="good"] { color: var(--good); }
.card-sub[data-tone="bad"] { color: var(--bad); }

.chart-card { margin: 0; }
.chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.chart-head p { color: var(--muted); font-size: 13px; }
.chart { position: relative; }
.plot { height: 260px; }
.plot svg { display: block; }
.plot text { fill: var(--muted); font-size: 12px; }
.plot .grid { stroke: var(--line); shape-rendering: crispEdges; }
.plot .bar { fill: var(--bar); }
.plot .bar.is-today { fill: var(--accent); }
.plot .value { fill: var(--text); font-weight: 600; }
.plot .day { font-size: 13px; }
.plot .day.is-today { fill: var(--text); font-weight: 700; }
.plot .slot { outline: none; }
.plot .wash { fill: var(--accent-soft); opacity: 0; }
.plot .slot:hover .wash, .plot .slot:focus .wash { opacity: .55; }
.plot .slot:focus-visible .wash { stroke: var(--accent); stroke-width: 2; }
.plot .hit { fill: transparent; }
.chart-note { position: absolute; inset: 0 0 46px; display: grid; place-items: center; padding: 0 16px; color: var(--muted); text-align: center; }
.tip { position: absolute; z-index: 1; padding: 8px 12px; border-radius: 8px; background: var(--text); color: #D9CCBD; font-size: 13px; line-height: 1.4; white-space: nowrap; pointer-events: none; transform: translate(-50%, -100%); }
.tip strong { display: block; color: #fff; font-size: 15px; }

#table tbody tr:last-child > * { font-weight: 600; } /* 맨 아래가 오늘 */

/* 불러오는 중: 처음에는 회색 칸, 다시 불러올 때는 보던 숫자를 흐리게 둔다 */
.home[data-state="loading"]:not([data-loaded]) :is(.card-value, .card-sub) { border-radius: 6px; background: var(--line); color: transparent; }
.home[data-state="loading"]:not([data-loaded]) .card-value { width: 60%; }
.home[data-state="loading"]:not([data-loaded]) .plot { border-radius: 8px; background: var(--bg); }
.home[data-state="loading"][data-loaded] :is(.cards, .chart-card) { opacity: .55; }

@media (max-width: 760px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .sidebar { flex-direction: row; align-items: center; gap: 12px; padding: 10px 12px; overflow-x: auto; scrollbar-width: none; }
  .brand { padding: 0 4px; font-size: 17px; white-space: nowrap; }
  .brand small { display: none; }
  .nav { flex-direction: row; }
  .share-box, .ai-box { flex: none; flex-direction: row; align-items: center; margin: 0; padding: 0 0 0 12px; border-top: 0; border-left: 1px solid rgba(255, 255, 255, .14); white-space: nowrap; }
  .ai-box select, .ai-box button { width: auto; }
  .ai-box p { min-height: 0; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">골목카페<small>운영 대시보드</small></div>
  <nav class="nav" aria-label="메뉴">
    <a href="#home">홈</a>
    <a href="#sales">매출</a>
    <a href="#menu">메뉴 · 재고</a>
    <a href="#reviews">리뷰 · AI 답글</a>
    <a href="#promo">AI 홍보 문구</a>
    <a href="#rivals">주변 카페</a>
  </nav>
  <div class="share-box">
    <button type="button" id="share-open" aria-label="오늘 요약 보내기" title="오늘 요약 보내기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 9h8M8 12.5h5"/></svg>
    </button>
  </div>
  <div class="ai-box">
    <label for="ai-model">AI 모델</label>
    <select id="ai-model" disabled><option>불러오는 중…</option></select>
    <button type="button" id="ai-check" disabled>지금 되는지 확인</button>
    <p id="ai-status" role="status"></p>
  </div>
</aside>

<main>
  <section class="view home page" id="home" data-state="loading">
    <div class="wrap">
      <header class="page-head">
        <h1>홈</h1>
        <p id="today"></p>
        <button type="button" class="btn brief-btn" id="brief-btn" disabled>오늘 브리핑</button>
      </header>

      <div class="notice" id="notice" hidden>
        <p id="notice-text"></p>
        <button type="button" class="btn btn-quiet" id="retry">다시 시도</button>
      </div>

      <section class="card brief" id="brief" hidden>
        <h2>오늘 브리핑</h2>
        <ul class="brief-lines" id="brief-lines" aria-live="polite"></ul>
        <p class="form-error" id="brief-error" role="alert" hidden></p>
        <p class="muted brief-note" id="brief-note"></p>
      </section>

      <div class="cards">
        <a class="card" href="#sales">
          <span class="card-label">오늘 매출</span>
          <strong class="card-value" id="v-sales">–</strong>
          <span class="card-sub" id="s-sales">&nbsp;</span>
        </a>
        <a class="card" href="#sales">
          <span class="card-label">오늘 주문 수</span>
          <strong class="card-value" id="v-count">–</strong>
          <span class="card-sub" id="s-count">&nbsp;</span>
        </a>
        <a class="card" href="#reviews">
          <span class="card-label">평균 별점</span>
          <strong class="card-value" id="v-rating">–</strong>
          <span class="card-sub" id="s-rating">&nbsp;</span>
        </a>
        <a class="card" href="#menu">
          <span class="card-label">재고 부족 메뉴</span>
          <strong class="card-value" id="v-stock">–</strong>
          <span class="card-sub" id="s-stock">&nbsp;</span>
        </a>
        <a class="card card-wide" href="#rivals">
          <span class="card-label">주변 카페</span>
          <strong class="card-value" id="v-rivals">–</strong>
          <span class="card-sub" id="s-rivals">&nbsp;</span>
        </a>
      </div>

      <figure class="card chart-card">
        <figcaption class="chart-head">
          <div>
            <h2>최근 7일 매출</h2>
            <p>하루 매출 · 막대를 누르면 금액이 보여요</p>
          </div>
          <button type="button" class="btn btn-quiet btn-small" id="toggle" aria-pressed="false" hidden>표로 보기</button>
        </figcaption>
        <div class="chart" id="chart">
          <div class="plot" id="plot"></div>
          <p class="chart-note" id="chart-note" hidden></p>
          <div class="tip" id="tip" hidden><strong id="tip-value"></strong><span id="tip-label"></span></div>
        </div>
        <table class="table" id="table" hidden>
          <thead><tr><th scope="col">날짜</th><th scope="col" class="num">매출</th><th scope="col" class="num">주문 수</th></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </figure>
    </div>
  </section>

  <iframe class="view" id="frame" title="" hidden></iframe>

  <section class="view soon" id="soon" hidden>
    <div>
      <span class="soon-badge">준비 중</span>
      <h1><span id="soon-name"></span> 화면은 아직 만들고 있어요</h1>
      <p>다 만들어지면 여기에서 볼 수 있어요.</p>
      <a class="btn" href="#home">홈으로 돌아가기</a>
    </div>
  </section>

  <section class="view soon" id="broken" hidden>
    <div>
      <h1><span id="broken-name"></span> 화면을 불러오지 못했어요</h1>
      <p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>
      <button type="button" class="btn" id="broken-retry">다시 시도</button>
    </div>
  </section>
</main>

<dialog class="share" id="share" aria-labelledby="share-title">
  <h2 id="share-title">오늘 요약 보내기</h2>
  <p class="muted" id="share-guide" aria-live="polite"></p>
  <textarea class="input" id="share-text" rows="6" readonly aria-label="보낼 요약" hidden></textarea>
  <p class="form-error" id="share-error" role="alert" hidden></p>
  <div class="share-actions">
    <span class="muted" id="share-count"></span>
    <button type="button" class="btn btn-quiet" id="share-close">닫기</button>
    <button type="button" class="btn" id="share-retry" hidden>다시 시도</button>
    <button type="button" class="btn" id="share-copy">복사하기</button>
    <button type="button" class="btn" id="share-send" hidden>공유하기</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase 연결 — publishable key만 넣는다. */
const SUPABASE_URL = 'https://ngyqprsdcajizpzoqxip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NwDpUc3O_dfJvOt9tA_Dhw_McmOYcMV';

const $ = id => document.getElementById(id);

/* ───── 메뉴를 누르면 가운데 화면 바꾸기 ───── */
const PAGES = {
  home:    { label: '홈' },
  sales:   { label: '매출', file: 'sales.html' },
  menu:    { label: '메뉴 · 재고', file: 'menu.html' },
  reviews: { label: '리뷰 · AI 답글', file: 'reviews.html' },
  promo:   { label: 'AI 홍보 문구', file: 'promo.html' },
  rivals:  { label: '주변 카페', file: 'rivals.html' },
};
const views = { home: $('home'), frame: $('frame'), soon: $('soon'), broken: $('broken') };
let showTurn = 0;

async function show() {
  const hash = location.hash.slice(1);
  const key = Object.hasOwn(PAGES, hash) ? hash : 'home';
  const page = PAGES[key];
  const turn = ++showTurn;

  for (const a of document.querySelectorAll('.nav a')) {
    if (a.hash === '#' + key) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  document.title = `${page.label} · 골목카페`;

  if (!page.file) { reveal('home'); loadHome(); return; }

  const state = await pageState(page.file);
  if (turn !== showTurn) return; // 기다리는 사이 다른 메뉴를 눌렀다
  if (state === 'ok') {
    views.frame.title = page.label;
    // src를 바꾸면 뒤로 가기 기록이 하나 더 쌓여 메뉴 표시와 화면이 어긋난다
    views.frame.contentWindow.location.replace(new URL(page.file, location.href));
    reveal('frame');
  } else if (state === 'missing') {
    $('soon-name').textContent = page.label;
    reveal('soon');
  } else {
    $('broken-name').textContent = page.label;
    reveal('broken');
  }
}

function reveal(name) {
  for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
}

// 'ok' 있다 · 'missing' 아직 만들지 않았다 · 'error' 인터넷이 끊겼거나 서버가 답하지 못했다
async function pageState(file) {
  if (location.protocol === 'file:') return 'ok'; // 파일을 직접 열면 확인할 방법이 없다
  try {
    const res = await fetch(file, { method: 'HEAD', cache: 'no-store' });
    return res.ok ? 'ok' : res.status === 404 ? 'missing' : 'error';
  } catch {
    return 'error';
  }
}

/* ───── 날짜와 금액 (날짜는 모두 한국 시간) ───── */
const KST = 9 * 60 * 60 * 1000;
const DAY = 24 * 60 * 60 * 1000;
const kstKey = t => new Date(t + KST).toISOString().slice(0, 10);       // 그 순간의 한국 날짜 '2026-10-11'
const kstMidnight = key => Date.parse(key + 'T00:00:00Z') - KST;        // 그 날짜가 한국에서 시작하는 순간
const lastDays = (n, now) => Array.from({ length: n }, (_, i) => kstKey(now - (n - 1 - i) * DAY));

function dayParts(key) {
  const [, m, d] = key.split('-').map(Number);
  return { m, d, week: '일월화수목금토'[new Date(key + 'T00:00:00Z').getUTCDay()] };
}
const longDate = key => { const p = dayParts(key); return `${p.m}월 ${p.d}일 ${p.week}요일`; };
const count = n => n.toLocaleString('ko-KR');
const won = n => count(Math.round(n)) + '원';
function shortWon(n) { // 좁은 자리에 쓰는 짧은 금액: 325,000 → 32.5만
  if (n >= 1e8) return count(+(n / 1e8).toFixed(1)) + '억';
  if (n >= 1e4) return count(+(n / 1e4).toFixed(1)) + '만';
  return count(n);
}

/* ───── 홈: 숫자 불러오기 ───── */
const NOTICE = {
  setup: '아직 가게 숫자를 연결하지 않았어요. 대시보드를 설치한 분이 연결을 마치면 여기에 오늘 숫자가 나와요.',
  error: '숫자를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.',
};
const LOW_STOCK = 5; // 재고가 이 개수 이하면 "재고 부족" (PRD 8장)
let db, homeTurn = 0, stats = null;

function setHome(state) {
  views.home.dataset.state = state;
  $('notice').hidden = !Object.hasOwn(NOTICE, state);
  $('notice').classList.toggle('is-error', state === 'error');
  $('notice-text').textContent = NOTICE[state] ?? '';
  $('retry').hidden = state !== 'error';
  if (!stats) chartNote(state === 'loading' ? '' : '숫자를 불러오면 여기에 그래프가 그려져요.');
}

async function loadHome() {
  const turn = ++homeTurn;
  const now = Date.now();
  $('today').textContent = longDate(kstKey(now));
  if (!SUPABASE_URL || !SUPABASE_KEY) { setHome('setup'); return; }

  setHome('loading');
  try {
    if (!window.supabase) throw new Error('Supabase 연결 도구를 불러오지 못했다');
    db ??= supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const since = new Date(kstMidnight(lastDays(7, now)[0])).toISOString();
    const [sales, menus, reviews, rivals] = await Promise.all([
      fetchAll(() => db.from('sales').select('id, sold_at, amount').gte('sold_at', since)),
      fetchAll(() => db.from('menus').select('id, name, stock').not('stock', 'is', null)),
      fetchAll(() => db.from('reviews').select('id, rating, reply')),
      fetchAll(() => db.from('rivals').select('id, name')),
    ]);
    if (turn !== homeTurn) return;
    renderHome(summarize(sales, menus, reviews, rivals, now));
    setHome('ready');
  } catch (err) {
    console.error(err);
    if (turn === homeTurn) setHome('error');
  }
}

// Supabase는 한 번에 1,000줄까지만 준다. 끝까지 받아야 합계가 맞는다.
async function fetchAll(query) {
  const size = 1000, rows = [];
  for (let from = 0; ; from += size) {
    const { data, error } = await query().order('id').range(from, from + size - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < size) return rows;
  }
}

function summarize(sales, menus, reviews, rivals, now) {
  const days = lastDays(7, now).map(key => ({ key, total: 0, count: 0 }));
  const byKey = Object.fromEntries(days.map(d => [d.key, d]));
  const yesterday = days.at(-2).key;
  let yesterdaySoFar = 0; // 어제 지금 시각까지 판 금액
  for (const s of sales) {
    const t = Date.parse(s.sold_at);
    const day = byKey[kstKey(t)];
    if (!day) continue;
    day.total += s.amount;
    day.count += 1;
    if (day.key === yesterday && t <= now - DAY) yesterdaySoFar += s.amount;
  }
  const low = menus.filter(m => m.stock != null && m.stock <= LOW_STOCK).sort((a, b) => a.stock - b.stock);
  const rated = reviews.reduce((sum, r) => sum + r.rating, 0);
  return {
    at: now, // 이 숫자를 읽은 시각
    days, yesterdaySoFar, low, rivals,
    reviews: { total: reviews.length, waiting: reviews.filter(r => !r.reply).length, avg: reviews.length ? rated / reviews.length : null },
  };
}

/* ───── 홈: 카드 ───── */
function renderHome(next) {
  stats = next;
  views.home.dataset.loaded = 'true';
  const today = stats.days.at(-1);

  $('v-sales').textContent = won(today.total);
  const change = compare(today.total, stats.yesterdaySoFar);
  $('s-sales').textContent = change.text;
  $('s-sales').dataset.tone = change.tone ?? '';

  // 주문 수 = 오늘 들어온 판매 기록의 줄 수
  $('v-count').textContent = count(today.count) + '건';
  $('s-count').textContent = today.count ? `한 건에 평균 ${won(today.total / today.count)}` : '오늘은 아직 주문이 없어요';

  $('v-rating').textContent = stats.reviews.total ? stats.reviews.avg.toFixed(1) + '점' : '–';
  $('s-rating').textContent = stats.reviews.total ? `리뷰 ${count(stats.reviews.total)}개 · 답글 기다리는 리뷰 ${count(stats.reviews.waiting)}개` : '아직 리뷰가 없어요';

  $('v-stock').textContent = count(stats.low.length) + '개';
  $('s-stock').textContent = stats.low.length ? `가장 적게 남은 메뉴: ${stats.low[0].name} (${stats.low[0].stock}개)` : '부족한 메뉴가 없어요';

  // 주변 카페: rivals 테이블에 저장해 둔 카페 (브리핑에는 보내지 않는다)
  const rivals = stats.rivals;
  $('v-rivals').textContent = count(rivals.length) + '곳';
  $('s-rivals').textContent = rivals.length
    ? rivals.slice(0, 5).map(r => r.name).join(' · ') + (rivals.length > 5 ? ` 외 ${count(rivals.length - 5)}곳` : '')
    : '저장해 둔 카페가 없어요. 눌러서 근처 카페를 찾아 보세요';

  $('toggle').hidden = false;
  $('brief-btn').disabled = briefBusy; // 숫자가 있어야 브리핑을 부탁할 수 있다
  fillTable();
  drawChart();
}

function compare(today, base) {
  if (!base) return { text: '어제 이 시간에는 판매가 없었어요' };
  const pct = Math.round((today - base) / base * 100);
  if (pct > 0) return { text: `▲ 어제 이 시간보다 ${pct}% 많아요`, tone: 'good' };
  if (pct < 0) return { text: `▼ 어제 이 시간보다 ${-pct}% 적어요`, tone: 'bad' };
  return { text: '어제 이 시간과 비슷해요' };
}

/* ───── 홈: 7일 매출 그래프 (SVG로 직접 그린다) ───── */
const plot = $('plot');
let bars = []; // 막대마다 말풍선을 띄울 자리

function drawChart() {
  const W = plot.clientWidth, H = plot.clientHeight;
  if (!stats || !W) return;
  const days = stats.days;
  const pad = { top: 26, right: 8, bottom: 46, left: 48 };
  const baseY = H - pad.bottom;
  const max = Math.max(...days.map(d => d.total));
  const step = max ? niceStep(max) : 0;
  const ticks = max ? Math.ceil(max / step) : 0;
  const top = ticks * step || 1;
  const y = v => Math.round(baseY - v / top * (baseY - pad.top));
  const slotW = (W - pad.left - pad.right) / days.length;
  const barW = Math.max(4, Math.min(24, Math.floor(slotW / 4) * 2));
  const fmt = slotW >= 84 ? won : n => shortWon(n) + '원';
  const todayAt = days.length - 1;
  const bestAt = max ? days.findIndex(d => d.total === max) : -1;

  // 눈금은 모두 같은 단위로 적는다 (7,500 다음에 1만이 오지 않게)
  const [unit, unitName] = step >= 1e8 ? [1e8, '억'] : step >= 1e4 ? [1e4, '만'] : [1, ''];
  let svg = '';
  for (let i = 0; i <= ticks; i++) {
    svg += `<line class="grid" x1="${pad.left}" x2="${W - pad.right}" y1="${y(i * step)}" y2="${y(i * step)}"/>`
         + `<text x="${pad.left - 8}" y="${y(i * step) + 4}" text-anchor="end">${i ? count(+(i * step / unit).toFixed(2)) + unitName : 0}</text>`;
  }

  bars = days.map((d, i) => {
    const cx = Math.round(pad.left + slotW * (i + 0.5));
    const barY = d.total ? Math.min(y(d.total), baseY - 2) : baseY;
    const p = dayParts(d.key);
    const isToday = i === todayAt;
    // 금액은 오늘과 가장 많이 판 날에만 적는다. 좁은 화면에서 둘이 붙어 있으면 오늘만 적는다.
    const labeled = isToday || (i === bestAt && !(slotW < 60 && bestAt === todayAt - 1));
    svg += `<g class="slot" tabindex="0" role="img" data-i="${i}" aria-label="${longDate(d.key)}, 매출 ${won(d.total)}, 주문 ${count(d.count)}건">`
         + `<rect class="wash" x="${cx - slotW / 2 + 2}" y="2" width="${slotW - 4}" height="${H - 4}" rx="6"/>`
         + (d.total ? `<path class="bar${isToday ? ' is-today' : ''}" d="${barPath(cx - barW / 2, barY, barW, baseY - barY)}"/>` : '')
         + (labeled ? `<text class="value" x="${cx}" y="${barY - 8}" text-anchor="middle">${fmt(d.total)}</text>` : '')
         + `<text class="day${isToday ? ' is-today' : ''}" x="${cx}" y="${baseY + 20}" text-anchor="middle">${isToday ? '오늘' : p.week}</text>`
         + `<text x="${cx}" y="${baseY + 38}" text-anchor="middle">${p.m}/${p.d}</text>`
         + `<rect class="hit" x="${cx - slotW / 2}" y="0" width="${slotW}" height="${H}"/>`
         + `</g>`;
    return { cx, tipY: barY - (labeled ? 28 : 10) }; // 금액이 적힌 막대는 말풍선을 그 위로 올린다
  });

  plot.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="최근 7일 하루 매출 막대 그래프">${svg}</svg>`;
  chartNote(max ? '' : '최근 7일 동안 판매 기록이 없어요.');
}

function niceStep(max) { // 눈금이 4칸을 넘지 않는 깔끔한 간격
  const rough = max / 4;
  const unit = 10 ** Math.floor(Math.log10(rough));
  return Math.max(1, Math.round([1, 2, 2.5, 5, 10].find(m => m * unit >= rough) * unit));
}

function barPath(x, y, w, h) { // 위쪽만 둥근 막대
  const r = Math.min(4, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function chartNote(text) {
  $('chart-note').textContent = text;
  $('chart-note').hidden = !text;
}

function showTip(i) {
  const d = stats.days[i], tip = $('tip');
  $('tip-value').textContent = won(d.total);
  $('tip-label').textContent = `${longDate(d.key)} · 주문 ${count(d.count)}건`;
  tip.hidden = false;
  const half = tip.offsetWidth / 2;
  tip.style.left = Math.min(Math.max(bars[i].cx, half), plot.clientWidth - half) + 'px';
  tip.style.top = bars[i].tipY + 'px';
}
const hideTip = () => { $('tip').hidden = true; };
const slotOf = e => e.target.closest?.('.slot');

for (const type of ['pointerover', 'focusin', 'click']) {
  plot.addEventListener(type, e => { const slot = slotOf(e); if (slot) showTip(+slot.dataset.i); });
}
plot.addEventListener('pointerleave', hideTip);
plot.addEventListener('focusout', hideTip);
document.addEventListener('pointerdown', e => { if (!slotOf(e)) hideTip(); });
new ResizeObserver(() => { hideTip(); drawChart(); }).observe(plot);

/* ───── 홈: 그래프와 같은 숫자를 표로 ───── */
function fillTable() {
  $('table-body').replaceChildren(...stats.days.map((d, i) => {
    const tr = document.createElement('tr');
    const day = document.createElement('th');
    day.scope = 'row';
    day.textContent = longDate(d.key) + (i === stats.days.length - 1 ? ' (오늘)' : '');
    tr.append(day);
    for (const text of [won(d.total), count(d.count) + '건']) Object.assign(tr.insertCell(), { className: 'num', textContent: text });
    return tr;
  }));
}

$('toggle').addEventListener('click', () => {

  $('table').hidden = !asTable;
  $('chart').hidden = asTable;
  $('toggle').textContent = asTable ? '그래프로 보기' : '표로 보기';

/* ───── AI 모델 고르기 ─────
   여기서 고른 모델을 모든 화면의 AI 기능이 쓴다. 고른 값은 이 브라우저에 저장한다(localStorage의 'cafe-ai-model').
   모델 목록은 cafe-ai가 알려 준다. 목록을 바꾸려면 함수의 MODELS만 고치면 된다. */
const AI_URL = `${SUPABASE_URL}/functions/v1/cafe-ai`;
const AI_MODEL_KEY = 'cafe-ai-model';
let aiModels = []; // cafe-ai가 알려 준 모델 목록 [{ id, name }]

async function askCafeAi(body) {
  let res;
  try {
    res = await fetch(AI_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {
    throw new Error('AI에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
  }
  const data = await res.json().catch(() => null);
  if (!res.ok || !data) throw new Error(data?.error ?? 'AI가 답하지 못했어요. 잠시 뒤에 다시 해 주세요.');
  return data;
}

function chosenModel() {
  try { return localStorage.getItem(AI_MODEL_KEY); } catch { return null; }
}

function aiStatus(text, tone = '') {
  $('ai-status').textContent = text;
  $('ai-status').dataset.tone = tone;
}

async function loadModels() {
  const select = $('ai-model');
  try {
    const { models, default: fallback } = await askCafeAi({ type: 'models' });
    aiModels = models;
    const saved = chosenModel(); // 저장소를 못 쓰는 브라우저에서는 기본 모델을 쓴다
    select.replaceChildren(...models.map(m => new Option(m.id === fallback ? `${m.name} (기본)` : m.name, m.id)));
    select.value = models.some(m => m.id === saved) ? saved : fallback;
    select.disabled = false;
    $('ai-check').disabled = false;
  } catch (err) {
    console.error(err);
    select.replaceChildren(new Option('목록을 못 불러왔어요', ''));
    aiStatus('새로고침하면 다시 불러와요.', 'bad');
  }
}

$('ai-model').addEventListener('change', e => {
  try { localStorage.setItem(AI_MODEL_KEY, e.target.value); } catch { /* 저장하지 못하면 모든 화면이 기본 모델을 쓴다 */ }
  aiStatus('');
});

// 고른 모델이 지금 답하는지 가장 짧은 질문으로 확인한다 (무료 모델은 한도에 걸려 잠깐씩 막힌다)
$('ai-check').addEventListener('click', async () => {
  const select = $('ai-model'), button = $('ai-check');
  select.disabled = button.disabled = true;
  aiStatus('확인하는 중…');
  const started = performance.now();
  try {
    await askCafeAi({ type: 'check', model: select.value });
    aiStatus(`✔ 지금 쓸 수 있어요 (${((performance.now() - started) / 1000).toFixed(1)}초)`, 'good');
  } catch (err) {
    aiStatus(`✖ ${err.message}`, 'bad');
  } finally {
    select.disabled = button.disabled = false;
  }
});

/* ───── 홈: 오늘 브리핑 ─────
   누르면 숫자부터 새로 읽고, 카드에 보이는 숫자 4개와 최근 7일 매출을 cafe-ai의 brief로 보내 세 줄 브리핑을 받는다.
   저장하지 않는다. 숫자가 바뀌면 다시 눌러 새로 받는다. */
let briefBusy = false;

function briefRequest() {
  const today = stats.days.at(-1);
  const body = {
    type: 'brief',
    // 카드 4개
    sales: today.total,
    orders: today.count,
    rating: stats.reviews.total ? Number(stats.reviews.avg.toFixed(1)) : null,
    lowStock: stats.low.length,
    // 최근 7일 매출 (오래된 날부터, 마지막이 오늘)
    week: stats.days.map(d => { const p = dayParts(d.key); return { day: `${p.m}/${p.d}(${p.week})`, sales: d.total }; }),
    // 카드 아래 한 줄에 쓰는 숫자도 함께 보내면 브리핑이 구체적이 된다
    yesterdaySales: stats.yesterdaySoFar,
    waitingReviews: stats.reviews.waiting,
  };
  if (stats.low.length) body.lowStockMenu = stats.low[0].name;
  // 다른 화면과 같게 이 브라우저에 저장된 모델을 쓴다. 없으면 보내지 않는다(함수가 기본 모델을 쓴다)
  const model = chosenModel();
  if (model) body.model = model;
  return body;
}

$('brief-btn').addEventListener('click', async () => {
  if (briefBusy || !stats) return;
  briefBusy = true;
  const box = $('brief'), lines = $('brief-lines'), button = $('brief-btn');
  box.hidden = false;
  box.toggleAttribute('data-busy', true);
  button.disabled = true;
  button.textContent = '브리핑 쓰는 중…';
  $('brief-error').hidden = true;
  const first = !lines.querySelector('li:not(.skeleton)');
  if (first) { // 처음에는 자리만 잡힌 회색 줄 세 개
    $('brief-note').textContent = '';
    lines.replaceChildren(...Array.from({ length: 3 }, () => {
      const li = document.createElement('li');
      li.className = 'skeleton';
      li.append(document.createElement('span'));
      return li;
    }));
  }
  try {
    await loadHome(); // 홈을 열어 둔 지 오래됐으면 카드의 숫자가 옛것이다. 못 읽으면 보던 숫자로 쓴다
    const at = stats.at;
    const ai = await askCafeAi(briefRequest());
    lines.replaceChildren(...ai.lines.map(text => Object.assign(document.createElement('li'), { textContent: text })));
    const time = new Date(at).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: 'numeric', minute: '2-digit' });
    const name = aiModels.find(m => m.id === ai.model)?.name;
    $('brief-note').textContent = `${time}의 숫자로 만들었어요` + (name ? ` · ${name} 모델이 썼어요` : '');
  } catch (err) {
    if (first) lines.replaceChildren(); // 앞서 받은 브리핑이 있으면 그대로 둔다
    $('brief-error').textContent = err.message;
    $('brief-error').hidden = false;
  } finally {
    briefBusy = false;
    box.removeAttribute('data-busy');
    button.disabled = false;
    button.textContent = '오늘 브리핑';
  }
});

/* ───── 오늘 요약 보내기 ─────
   왼쪽 메뉴 아래 버튼. 오늘 매출 · 주문 수 · 평균 별점을 새로 읽어 200자 안의 글로 만든다.
   키가 필요 없는 방법만 쓴다 (PRD 5.1). 카카오톡으로 저절로 보내지는 못하고, 복사하거나 공유 창을 열어 넘긴다. */
let shareTurn = 0;

// 공유 창은 휴대폰 · 태블릿에서만 쓴다. PC의 공유 창에는 카카오톡이 없어서 복사가 낫다
const canShare = () => !!navigator.share && matchMedia('(pointer: coarse)').matches;

async function todaySummary() {
  if (!window.supabase) throw new Error('Supabase 연결 도구를 불러오지 못했다');
  db ??= supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const now = Date.now(), key = kstKey(now);
  const [sales, reviews] = await Promise.all([
    fetchAll(() => db.from('sales').select('amount').gte('sold_at', new Date(kstMidnight(key)).toISOString())),
    fetchAll(() => db.from('reviews').select('rating')),
  ]);
  const total = sales.reduce((sum, s) => sum + s.amount, 0);
  const rated = reviews.reduce((sum, r) => sum + r.rating, 0);
  const time = new Date(now).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: 'numeric', minute: '2-digit' });
  // 네 줄로 고정한 모양이라 숫자가 커져도 200자를 넘지 않는다
  return [
    `[골목카페] ${longDate(key)} ${time}`,
    `· 오늘 매출 ${won(total)}`,
    `· 주문 ${count(sales.length)}건` + (sales.length ? ` (한 건에 평균 ${won(total / sales.length)})` : ''),
    reviews.length ? `· 평균 별점 ${(rated / reviews.length).toFixed(1)}점 (리뷰 ${count(reviews.length)}개)` : '· 평균 별점: 아직 리뷰가 없어요',
  ].join('\n');
}

// state: 'loading' 세는 중 · 'ready' 요약이 나왔다 · 'error' 숫자를 읽지 못했다
function setShare(state) {
  const ready = state === 'ready', failed = state === 'error', share = canShare();
  $('share-guide').textContent = !ready ? '오늘 숫자를 세는 중…'
    : share ? '공유 창에서 카카오톡을 고르고 "나와의 채팅"으로 보내 주세요.'
    : '복사한 뒤 카카오톡 "나와의 채팅"에 붙여 넣어 주세요.';
  $('share-guide').hidden = failed;
  $('share-text').hidden = !ready;
  $('share-count').textContent = ready ? `${count($('share-text').value.length)}자 / 200자` : '';
  shareProblem(failed ? '숫자를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.' : null);
  $('share-retry').hidden = !failed;
  $('share-copy').hidden = failed;
  $('share-send').hidden = failed || !share;
  $('share-copy').classList.toggle('btn-quiet', share); // 강조 버튼은 하나만: 공유가 되면 공유, 아니면 복사
  $('share-copy').disabled = $('share-send').disabled = !ready;
}

function shareProblem(text) {
  $('share-error').textContent = text ?? '';
  $('share-error').hidden = !text;
}

async function openShare() {
  const turn = ++shareTurn;
  if (!$('share').open) $('share').showModal();
  setShare('loading');
  try {
    const text = await todaySummary();
    if (turn !== shareTurn) return; // 기다리는 사이 다시 눌렀다
    $('share-text').value = text;
    setShare('ready');
    (canShare() ? $('share-send') : $('share-copy')).focus();
  } catch (err) {
    console.error(err);
    if (turn === shareTurn) setShare('error');
  }
}

$('share-open').addEventListener('click', openShare);
$('share-retry').addEventListener('click', openShare);
$('share-close').addEventListener('click', () => $('share').close());

$('share-copy').addEventListener('click', async () => {
  const box = $('share-text');
  try {
    await navigator.clipboard.writeText(box.value);
  } catch {
    // 권한이 없는 브라우저에서는 옛 방식으로 복사한다
    box.select();
    if (!document.execCommand('copy')) return shareProblem('복사하지 못했어요. 위 글자를 직접 선택해서 복사해 주세요.');
  }
  $('share').close();
  toast('요약을 복사했어요. 카카오톡 "나와의 채팅"에 붙여 넣어 주세요.');
});

$('share-send').addEventListener('click', async () => {
  try {
    await navigator.share({ text: $('share-text').value });
    $('share').close();
  } catch (err) {
    // 공유 창을 그냥 닫은 것(AbortError)은 실패가 아니다
    if (err.name !== 'AbortError') shareProblem('공유 창을 열지 못했어요. "복사하기"로 복사해서 붙여 넣어 주세요.');
  }
});

/* ───── 알림 ───── */
let toastTimer;
function toast(text, isError = false) {
  const box = $('toast');
  box.textContent = text;
  box.classList.toggle('is-error', isError);
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, isError ? 5000 : 2500);
}

loadModels();
addEventListener('hashchange', show);
show();
</script>
</body>
