<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 홍보 문구 · 골목카페</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* ===== 공통 시작 — 다섯 페이지가 똑같이 쓴다 (PRD 6장). 고치면 다섯 파일을 모두 고친다. ===== */
:root {
  --bg: #FAF7F2;
  --surface: #FFFFFF;
  --sidebar: #2B2118;
  --text: #2B2118;
  --muted: #76685A;
  --line: #E8DFD3;
  --accent: #A85A17;
  --accent-soft: #F3E4D3;
  --bar: #B5A38F;
  --good: #2E7D4F;
  --warn: #A66300;
  --bad: #B3261E;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
h1 { margin: 0; font-size: 22px; font-weight: 700; }
h2 { margin: 0; font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { padding: 32px; }
.wrap { max-width: 1120px; }
.page-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 20px; }
.page-head p { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.card-label { color: var(--muted); font-size: 13px; }
.card-value { font-size: 28px; font-weight: 700; line-height: 1.3; }
.card-sub { color: var(--muted); font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap; }
.btn-quiet { border-color: var(--line); background: var(--surface); color: var(--text); font-weight: 500; }
.btn-small { padding: 6px 12px; font-size: 13px; }
.btn-danger { border-color: var(--bad); background: var(--bad); }

.field { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 13px; }
.input { min-width: 0; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 15px; }
.input::placeholder { color: var(--muted); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.form-error { color: var(--bad); font-size: 13px; }
.chip { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.step { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 17px; line-height: 1; }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge::before { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); content: ""; }
.badge-good::before { background: var(--good); }
.badge-warn::before { background: var(--warn); }
.badge-bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad); }
.badge-bad::before { background: var(--bad); }

.notice { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.notice::before { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); color: #fff; font-size: 13px; font-weight: 700; line-height: 22px; text-align: center; content: "i"; }
.notice.is-error { border-color: var(--bad); }
.notice.is-error::before { background: var(--bad); content: "!"; }
.notice p { flex: 1 1 260px; }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-weight: 400; text-align: left; }
.table thead th { color: var(--muted); font-size: 13px; }
.table .num { font-variant-numeric: tabular-nums; text-align: right; }
.table tbody tr:last-child > * { border-bottom: 0; }
.table-wrap { overflow-x: auto; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.skeleton span { display: block; height: 20px; border-radius: 6px; background: var(--line); }
.empty { padding: 32px 16px; color: var(--muted); text-align: center; }
.muted { color: var(--muted); }

.toast { position: fixed; bottom: 24px; left: 50%; z-index: 10; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px; background: var(--text); color: #fff; font-size: 14px; transform: translateX(-50%); }
.toast.is-error { background: var(--bad); }

@media (max-width: 760px) { .page { padding: 16px; } }
/* ===== 공통 끝 ===== */

/* 문구 만들기 */
.make { margin-bottom: 16px; }
.make h2 { margin-bottom: 12px; }
.make-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: end; gap: 12px 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.make .chip { min-height: 40px; }
.ai-note { margin-top: 10px; font-size: 13px; }
.make .form-error { margin-top: 4px; }
.skeleton span + span { width: 60%; margin-top: 10px; }

/* 만든 문구 */
.result-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
.result-head p { font-size: 13px; }
.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.option { display: flex; flex-direction: column; gap: 8px; }
.option-no { font-size: 13px; font-weight: 600; }
.option-text { flex: 1; overflow-wrap: anywhere; white-space: pre-wrap; }
#result[data-busy] .options { opacity: .55; }

@media (max-width: 900px) { .options { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .make-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body class="page">

<div class="wrap">
  <header class="page-head">
    <h1>AI 홍보 문구</h1>
    <p>메뉴와 분위기를 고르면 SNS에 올릴 문구를 3개 써 드려요</p>
  </header>

  <div class="notice is-error" id="notice" hidden>
    <p>메뉴를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.</p>
    <button type="button" class="btn btn-quiet" id="retry">다시 시도</button>
  </div>

  <div class="notice" id="no-menus" hidden>
    <p>홍보 문구를 만들려면 먼저 메뉴가 있어야 해요.</p>
    <a class="btn btn-quiet" href="index.html#menu" target="_top">메뉴 추가하러 가기</a>
  </div>

  <div class="card make skeleton" id="loading"><span></span><span></span></div>

  <form class="card make" id="make" novalidate hidden>
    <h2>문구 만들기</h2>
    <div class="make-grid">
      <label class="field">메뉴
        <select class="input" id="menu"></select>
      </label>
      <div class="field"><span id="mood-label">분위기</span>
        <div class="chips" id="moods" role="group" aria-labelledby="mood-label"></div>
      </div>
      <button class="btn" id="submit">문구 만들기</button>
    </div>
    <p class="muted ai-note" id="ai-note"></p>
    <p class="form-error" id="error" role="alert" hidden></p>
  </form>

  <section id="result" hidden>
    <div class="result-head">
      <h2 id="result-title"></h2>
      <p class="muted" id="result-note"></p>
    </div>
    <div class="options" id="options"></div>
  </section>
  <p class="card empty" id="hint" hidden>메뉴와 분위기를 고르고 "문구 만들기"를 눌러 보세요.</p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase 연결 — publishable key만 넣는다. */
const SUPABASE_URL = 'https://ngyqprsdcajizpzoqxip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NwDpUc3O_dfJvOt9tA_Dhw_McmOYcMV';
const AI_URL = `${SUPABASE_URL}/functions/v1/cafe-ai`;
const AI_MODEL_KEY = 'cafe-ai-model'; // 대시보드 왼쪽 아래 "AI 모델"에서 고른 값
const CATEGORIES = ['커피', '음료', '디저트', '기타'];
const MOODS = ['따뜻하게', '재미있게', '짧게']; // 이 글자를 그대로 cafe-ai에 보낸다. "짧게"는 함수가 길이 규칙을 바꾼다

const $ = id => document.getElementById(id);

let db;
let menus = [];
let mood = MOODS[0];
let busy = false;
let result = null; // 마지막으로 만든 문구: { options, menu, mood, model }. 저장하지 않으므로 화면을 떠나면 사라진다
let modelNames = {};

// 글자는 모두 textContent로 넣는다 (메뉴 이름은 사람이 적은 글, 문구는 AI가 쓴 글)
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'text') node.textContent = value;
    else if (value === true) node.setAttribute(key, '');
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  node.append(...children.filter(Boolean));
  return node;
}

/* ───── 메뉴 불러오기 ───── */
async function load() {
  $('notice').hidden = true;
  $('loading').hidden = false; // 불러오는 동안에는 자리만 잡힌 회색 칸
  try {
    if (!window.supabase) throw new Error('Supabase 연결 도구를 불러오지 못했다');
    db ??= supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    menus = (await fetchAll(() => db.from('menus').select('id, name, category'))).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    render();
  } catch (err) {
    console.error(err);
    $('notice').hidden = false;
  } finally {
    $('loading').hidden = true;
  }
}

// Supabase는 한 번에 1,000줄까지만 준다.
async function fetchAll(query) {
  const size = 1000, rows = [];
  for (let from = 0; ; from += size) {
    const { data, error } = await query().order('id').range(from, from + size - 1);
    if (error) throw error;
    rows.push(...data);
    if (data.length < size) return rows;
  }
}

/* ───── AI 부르기 ───── */
async function askCafeAi(body) {
  let res;
  try {
    res = await fetch(AI_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch {
    throw new Error('AI에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
  }
  const data = await res.json().catch(() => null);
  if (!res.ok || !data) throw new Error(data?.error ?? 'AI가 답하지 못했어요. 잠시 뒤에 다시 해 주세요.');
  return data;
}

function chosenModel() {
  try { return localStorage.getItem(AI_MODEL_KEY); } catch { return null; }
}

// 지금 어느 모델로 쓰는지 보여 준다. 대시보드에서 모델을 바꾸면 바로 따라 바뀐다.
async function showModel() {
  try {
    if (!Object.keys(modelNames).length) {
      const { models, default: fallback } = await askCafeAi({ type: 'models' });
      modelNames = Object.fromEntries(models.map(m => [m.id, m.name]));
      modelNames[''] = modelNames[fallback];
    }
    $('ai-note').textContent = `AI 모델: ${modelNames[chosenModel()] ?? modelNames['']} · 대시보드 왼쪽 아래에서 바꿀 수 있어요`;
    if (result) render(); // 만든 문구 옆의 모델 이름도 채운다
  } catch {
    $('ai-note').textContent = '';
  }
}
addEventListener('storage', e => { if (e.key === AI_MODEL_KEY) showModel(); });

/* ───── 그리기 ───── */
function render() {
  $('no-menus').hidden = menus.length > 0;
  $('make').hidden = menus.length === 0;

  // 메뉴를 분류별로 묶어 보여 준다
  const select = $('menu');
  const chosen = select.value;
  const groups = [...new Set([...CATEGORIES, ...menus.map(m => m.category)])]
    .map(name => [name, menus.filter(m => m.category === name)])
    .filter(([, list]) => list.length);
  select.replaceChildren(
    el('option', { value: '', text: '메뉴를 골라 주세요' }),
    ...groups.map(([name, list]) => el('optgroup', { label: name }, ...list.map(m => el('option', { value: m.id, text: m.name })))));
  select.value = menus.some(m => String(m.id) === chosen) ? chosen : '';
  select.disabled = busy;

  $('moods').replaceChildren(...MOODS.map(name =>
    el('button', { type: 'button', class: 'chip', 'aria-pressed': String(name === mood), disabled: busy, text: name })));
  $('submit').disabled = busy;
  $('submit').textContent = busy ? '쓰는 중…' : result ? '다시 만들기' : '문구 만들기';

  $('hint').hidden = !!result || menus.length === 0;
  $('result').hidden = !result;
  $('result').toggleAttribute('data-busy', busy);
  if (!result) return;
  $('result-title').textContent = `${result.menu} · ${result.mood}`;
  $('result-note').textContent = modelNames[result.model] ? `${modelNames[result.model]} 모델이 썼어요` : '';
  $('options').replaceChildren(...result.options.map((text, i) =>
    el('article', { class: 'card option' },
      el('p', { class: 'option-no muted', text: `문구 ${i + 1}` }),
      el('p', { class: 'option-text', text }),
      el('div', { class: 'row-actions' },
        el('button', { type: 'button', class: 'btn btn-quiet btn-small', 'data-copy': i, 'aria-label': `문구 ${i + 1} 복사`, text: '복사' })))));
}

function showProblem(text, input) {
  $('menu').setAttribute('aria-invalid', String(input === $('menu')));
  $('error').textContent = text ?? '';
  $('error').hidden = !text;
  input?.focus();
}

/* ───── 분위기 고르기 ───── */
$('moods').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip || busy) return;
  mood = chip.textContent;
  render();
  [...$('moods').children].find(c => c.textContent === mood)?.focus();
});

$('menu').addEventListener('change', () => showProblem(null));

/* ───── 문구 만들기 ───── */
$('make').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const menu = menus.find(m => String(m.id) === $('menu').value);
  if (!menu) return showProblem('메뉴를 골라 주세요.', $('menu'));
  showProblem(null);

  busy = true;
  render();
  try {
    const body = { type: 'promo', menu: menu.name, mood };
    const model = chosenModel();
    if (model) body.model = model;
    const ai = await askCafeAi(body);
    result = { options: ai.options, menu: menu.name, mood, model: ai.model };
  } catch (err) {
    showProblem(err.message); // 함수가 알려 준 이유를 그대로 보여 준다. 앞서 만든 문구는 그대로 둔다
  } finally {
    busy = false;
    render();
    if (document.activeElement === document.body) $('submit').focus();
  }
});

/* ───── 복사 ───── */
$('options').addEventListener('click', async e => {
  const button = e.target.closest('[data-copy]');
  if (!button) return;
  const text = result.options[Number(button.dataset.copy)];
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // 권한이 없는 브라우저에서는 옛 방식으로 복사한다
    const box = el('textarea', { text });
    document.body.append(box);
    box.select();
    const done = document.execCommand('copy');
    box.remove();
    if (!done) return toast('복사하지 못했어요. 문구 글자를 직접 선택해서 복사해 주세요.', true);
  }
  toast('문구를 복사했어요.');
});

/* ───── 알림 ───── */
let toastTimer;
function toast(text, isError = false) {
  const box = $('toast');
  box.textContent = text;
  box.classList.toggle('is-error', isError);
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, isError ? 5000 : 2500);
}

$('retry').addEventListener('click', () => { window.supabase ? load() : location.reload(); });

load();
showModel();
</script>
</body>
</html>
